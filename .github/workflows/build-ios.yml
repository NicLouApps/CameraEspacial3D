name: Build CameraEspacial3D iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Release App (Unsigned)
        run: |
          xcodebuild \
            -project CameraEspacial3D.xcodeproj \
            -scheme CameraEspacial3D \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CameraEspacial3D.app Payload/
          zip -qry CameraEspacial3D_v1.0_2026-11-22_23h14.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraEspacial3D-iOS-IPA-v1.0_2026-11-22_23h14
          path: CameraEspacial3D_v1.0_2026-11-22_23h14.ipa
